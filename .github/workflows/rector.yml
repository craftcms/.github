name: Rector
on:
  workflow_call:
    inputs:
      craft_version:
        default: '3'
        type: string
    secrets:
      packagist_username:
        required: false
      packagist_token:
        required: false

permissions: {}

jobs:
  rector:
    name: Rector
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup PHP
        id: setup-php
        uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
        with:
          # PHP 8.4 is required, so Rector's code is PHP 8.4 compatible
          php-version: 8.4
          coverage: none
          extensions: 'ctype,curl,dom,iconv,imagick,intl,json,mbstring,openssl,pcre,pdo,reflection,spl,zip'
          ini-values: post_max_size=256M, max_execution_time=180, memory_limit=512M
          ini-file: development
          tools: composer:v2
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPOSER_AUTH_JSON: |
            {
              "http-basic": {
                "repo.packagist.com": {
                  "username": "${{ secrets.packagist_username }}",
                  "password": "${{ secrets.packagist_token }}"
                }
              }
            }

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set version
        env:
          CRAFT_VERSION: ${{ inputs.craft_version }}
        run: composer config version "${CRAFT_VERSION}.x-dev"

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-ansi --no-progress

      - name: Run Rector
        run: vendor/bin/rector process --dry-run --ansi
