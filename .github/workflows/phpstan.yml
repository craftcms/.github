name: PHPStan
on:
  workflow_call:
    secrets:
      packagist_username:
        required: false
      packagist_token:
        required: false
    inputs:
      craft_version:
        default: '3'
        type: string
      php_version:
        required: true
        type: string
      working_directory:
        default: '.'
        type: string

permissions: {}

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Setup PHP
        id: setup-php
        uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: 'ctype,curl,dom,iconv,imagick,intl,json,mbstring,openssl,pcre,pdo,reflection,spl,zip'
          ini-values: post_max_size=256M, max_execution_time=180, memory_limit=512M
          ini-file: development
          tools: composer:v2
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPOSER_AUTH_JSON: |
            {
              "http-basic": {
                "repo.packagist.com": {
                  "username": "${{ secrets.packagist_username }}",
                  "password": "${{ secrets.packagist_token }}"
                }
              }
            }
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set version
        env:
          CRAFT_VERSION: ${{ inputs.craft_version }}
        run: composer config version "${CRAFT_VERSION}.x-dev"
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-ansi --no-progress
      - name: Check .env.example.mysql exists
        id: check_files
        uses: andstor/file-existence-action@f02338908d150e00a4b8bebc2dad18bd9e5229b0 # v1
        with:
          files: "${{ inputs.working_directory }}/tests/.env.example.mysql"
      - name: Copy tests .env
        if: ${{ steps.check_files.outputs.files_exists == 'true' }}
        run: cp ./tests/.env.example.mysql ./tests/.env
      - name: Create folders
        if: ${{ steps.check_files.outputs.files_exists == 'true' }}
        run: mkdir tests/_craft/storage/runtime/compiled_classes
      - name: Build Codeception support files
        if: ${{ steps.check_files.outputs.files_exists == 'true' }}
        run: "vendor/bin/codecept build"
      - name: Run PHPStan checks
        run: "vendor/bin/phpstan --memory-limit=2G"
