name: PHPStan
on:
  workflow_call:
    secrets:
      packagist_username:
        required: false
      packagist_token:
        required: false
    inputs:
      php_version:
        required: true
        type: string
jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: 'ctype,curl,dom,iconv,imagick,intl,json,mbstring,openssl,pcre,pdo,reflection,spl,zip'
          ini-values: post_max_size=256M, max_execution_time=180, memory_limit=512M
          ini-file: development
          tools: composer:v2
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPOSER_AUTH_JSON: |
            {
              "http-basic": {
                "repo.packagist.com": {
                  "username": "${{ secrets.packagist_username }}",
                  "password": "${{ secrets.packagist_token }}"
                }
              }
            }
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-ansi --no-progress
      - name: Check .env.example.mysql exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: "tests/.env.example.mysql"
      - name: Copy tests .env
        if: ${{ steps.check_files.outputs.files_exists == 'true' }}
        run: cp ./tests/.env.example.mysql ./tests/.env
      - name: Create folders
        if: ${{ steps.check_files.outputs.files_exists == 'true' }}
        run: mkdir tests/_craft/storage/runtime/compiled_classes
      - name: Build Codeception support files
        if: ${{ steps.check_files.outputs.files_exists == 'true' }}
        run: "vendor/bin/codecept build"
      - name: Run PHPStan checks
        run: "vendor/bin/phpstan --memory-limit=2G"
